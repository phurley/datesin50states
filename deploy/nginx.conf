# /etc/nginx/sites-available/datesin50states.conf  (installed by deploy/provision.sh)
# certbot --nginx adds the 443/ssl bits and the http->https redirect to this file.
upstream datesin50states_app {
    server 127.0.0.1:3050;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    client_max_body_size 80m;
    limit_req zone=general burst=40 nodelay;

    # Photos are immutable (uuid filenames); serve straight from disk.
    location /media/ {
        alias /var/lib/datesin50states/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /auth/ {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass http://datesin50states_app;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://datesin50states_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;   # big photo uploads are resized server-side
    }
}
