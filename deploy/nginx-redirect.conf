# /etc/nginx/sites-available/datesin50states-redirect.conf  (installed by deploy/provision.sh)
# Any subdomain (www., foo., ...) -> https://datesin50states.com, keeping the path.
server {
    listen 80;
    listen [::]:80;
    server_name *.datesin50states.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://datesin50states.com$request_uri; }
}
#__HTTPS__
