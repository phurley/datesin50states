server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.datesin50states.com;
    ssl_certificate /etc/letsencrypt/live/datesin50states.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datesin50states.com-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://datesin50states.com$request_uri;
}
